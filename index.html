<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Shadow Depths</title>
    <style>
      /* Reset + full-bleed canvas shell. All in-game UI is drawn by Renderer
         or layered as positioned DOM nodes inside #game-root. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #d6d6da;
        font-family: 'Courier New', ui-monospace, monospace;
        overflow: hidden;
        height: 100%;
        width: 100%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }
      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050507;
      }
      #game-canvas {
        display: block;
        background: #0a0a0c;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100vw;
        max-height: 100vh;
      }
      #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #ui-layer > * {
        pointer-events: auto;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas" width="800" height="600"></canvas>
      <div id="ui-layer"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
