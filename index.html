<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Shadow Depths</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&family=Inconsolata:wght@400;700&display=swap"
      rel="stylesheet">
    <style>
      /* Ensure fonts are loaded before canvas first paint. The Renderer
         draws text via ctx.font, so the font face needs to be available
         in the document's font cache. The CSS below forces the browser
         to download all three families on first paint. */
      .__font-preload {
        position: absolute; left: -9999px; visibility: hidden;
        font-family: 'Cinzel', 'IM Fell English', 'Inconsolata';
      }
    </style>
    <style>
      /* Reset + full-bleed canvas shell. All in-game UI is drawn by Renderer
         or layered as positioned DOM nodes inside #game-root. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #d6d6da;
        font-family: 'Courier New', ui-monospace, monospace;
        overflow: hidden;
        height: 100%;
        width: 100%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }
      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050507;
      }
      #game-canvas {
        display: block;
        background: #0a0a0c;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        max-width: 100vw;
        max-height: 100vh;
      }
      #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #ui-layer > * {
        pointer-events: auto;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas" width="480" height="1040"></canvas>
      <div id="ui-layer"></div>
      <!-- Pre-loads the font families so Canvas ctx.font picks them up. -->
      <span class="__font-preload">
        <span style="font-family:'Cinzel',serif">.</span>
        <span style="font-family:'IM Fell English',serif">.</span>
        <span style="font-family:'Inconsolata',monospace">.</span>
      </span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
